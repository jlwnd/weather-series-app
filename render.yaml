services:
  - type: web
    name: weather-series-app-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm --prefix ../frontend ci && npm --prefix ../frontend run build && npm run migrate:prod
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
